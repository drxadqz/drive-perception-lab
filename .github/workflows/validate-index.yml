name: Validate reading index

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify SOTA and transfer-opportunity radars
        run: python scripts/rebuild_research_radar.py --check

      - name: Verify generated pages and metadata
        run: python scripts/rebuild_index.py --check

      - name: Reject live math and validate cross-device formula assets
        run: python scripts/lint_markdown_math.py

      - name: Run Markdown validation regressions
        run: python -m unittest discover -s tests -v

      - name: Set up Node for the published cross-device render smoke test
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned public-page test dependencies
        run: npm ci

      - name: Install the WebKit test browser
        run: |
          npx playwright install --with-deps webkit

      - name: Verify changed formulas on GitHub across desktop and iPad profiles
        env:
          RENDER_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          RENDER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RENDER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check_published_math.mjs
