name: Validate reading index

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated pages and metadata
        run: python scripts/rebuild_index.py --check

      - name: Verify GitHub-safe Markdown math
        run: python scripts/lint_markdown_math.py

      - name: Run Markdown validation regressions
        run: python -m unittest discover -s tests -v
